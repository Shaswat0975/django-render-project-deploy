<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container{
            width: 380px;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        h1{
            text-align: center;
            color: #ff6600;
            margin-bottom: 20px;

        }
        .input{
            margin-bottom: 15px;
        }
        .input input{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 9px;
            outline: none;

        }
        button{
            width: 100%;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .back{
        font-weight: bold;
        position: fixed;
        right:20px;
        bottom: 20px;
        color: white;
        background: #2563eb;
        padding: 12px 20px;
        text-decoration: none;
        border-radius: 50px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }
    </style>
</head>
<body>
    <div class="container">
        <h1>Change Password</h1>
        <form method="post" onsubmit="return Check_password()" action="{% url 'update_password' %}">
            {% csrf_token %}
            <div class="input">
                <input type="password" name="old_password" required placeholder="Current Password">
            </div>

            <div class="input">
                <input type="password" name="new_password" required placeholder="New Password" id="np">
            </div>

            <div class="input">
                <input type="password" name="conf_password" required placeholder="Confirm Password" id="cp">
            </div>

            <button type="submit">Update Password</button> 
        </form>
    </div>
    <a href="{% url 'AdminHome' %}"  class="back">Back to Dashboard</a>
    <script>
        function Check_password(){
            let np=document.getElementById('np').value
           let  cp=document.getElementById('cp').value
            if(np!=cp){
                alert("Password and confirm password does not match !")
                return false;
            }
            return true;
        }
    </script>
</body>
</html>
