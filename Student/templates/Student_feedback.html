<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback</title>
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    }
    body{
    background: linear-gradient(135deg,#7489ae,#cfdef3);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px;

    }
     .form-container{
        width: 100%;
        max-width: 500px;
        padding: 30px;
        background-color: rgba(255,255,255, 0.9);
        border-radius: 15px;
        box-shadow: 0 8px 20px rgba(0,0, 0, 0.15);
        position: relative;
        top:100px;
    }
     h1{
        text-align: center;
        margin-bottom: 25px;
        color: black;
        font-weight: bold;
    }
     .form-group{
        margin-bottom: 18px;
    }
    label{
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
    }
     input,textarea{

        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #ccc;
        outline: none;
        transition: 0.3s;
        resize: none;
    }
     input:focus,textarea:focus{
        border-color: #3498db;
        box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
    }
    textarea{
        height: 90px;
    }
    .back{
        font-weight: bold;
        position: fixed;
        right:20px;
        bottom: 20px;
        color: white;
        background: #2563eb;
        padding: 12px 20px;
        text-decoration: none;
        border-radius: 50px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }
    .btn{
        padding: 10px 20px;
        border-radius: 8px;
        background-color: #3498db;
        color: white;
        border: none;
        text-align: center;
        width: 70%;
        height: 45px;
        position: relative;
        left: 60px;
        top: 10px;
        transition-property: transform;
        transition-duration: 0.3s;
        }
        .btn:hover{
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(8, 47, 176, 0.5);
        }
    </style>
</head>
<body>
    <div  class="form-container">      
        <h1>Student Feedback</h1>
        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="sname" placeholder="Student Name" required>
            </div>
      
             <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Student email" required>
            </div>

            <div class="form-group">
                <label>Feedback</label>
                <textarea name="Feedback" placeholder="Enter your feedback" required></textarea>
            </div>

            <input type="submit" value="Submit" class="btn">
        </form>
    </div>
    <a href="{% url 'AdminHome' %}"  class="back">Back to Dashboard</a>
</body>
</html>
