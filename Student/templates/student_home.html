{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Home</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        body{
            background-color: #f4f7fc;
        }
        .header{
            width: 100%;
            background: #ff6600;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 14px;
        }
        .header h2{
            font-size: 18px;

        }
        .profile{
            width: 90%;
            margin: 25px auto;
            background: white;
            border-radius: 10px;
            padding: 25px;
            display: flex;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .info{
            margin-right: 20px;
        }
        .info h3{
            color: #333;
        }
        .info p{
            color: #666;
            margin-top: 5px;
        }
        .cards{
            width: 90%;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(230px,1fr));
            gap: 25px;
        }
        .card{
            background: #fff;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .card:hover{
            transform: translateY(-8px);
        }
        .profile img{
            height: 90px;
            width: 90px;
            border-radius: 50%;
            border: 3px solid #ff6600;
        }
        .card h3{
            margin-bottom: 15px;
        }
        .profile .info{
            margin-left: 20px;
        }
        .card a{
            text-decoration: none;
            background: #ff6600;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            position: relative;
            top: 5px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>Student Dashboard</h2>
        <a href="{% url 'admin_logout' %}">Logout</a>
    </div>
    
    <div class="profile">
        {% if student.image %}
        <img src="{{student.image.url}}">
        {% endif %}
        <div class="info">
            <h3>Welcome {{ student.name}}</h3>
            <p>{{ student.email}}</p>
            <p>{{ student.phone}}</p>
            <p>{{ student.technology}}</p>
        </div>

        <div class="cards">
            <div class="card">
                <h3>Edit Profile</h3>
                <a href="{% url 'edit_profile' %}">Edit</a>
            </div>

            <div class="card">
                <h3>Fee Details</h3>
                <a href="{% url 'student_fee' %}">View</a>
            </div>

            <div class="card">
                <h3>Change Password</h3>
                <a href="{% url 'change_user_password' %}">Change</a>
            </div>
             
        </div>
    </div>


</body>
</html>
